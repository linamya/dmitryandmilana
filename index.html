<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Свадебное приглашение</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ВИДЕО-ФОН -->
    <div class="custom-bg-taplink">
        <video autoplay muted loop playsinline preload="auto" disablepictureinpicture id="bg-video" class="js-bg-video">
            <source src="video.mp4" type="video/mp4">
        </video>
        <div class="custom-overlay"></div>
    </div>

    <!-- Основной контент сайта -->
    <div class="site-wrapper">

        <!-- Блок 1 - Фото 1 -->
        <div class="block image-block">
            <img src="photo1.png" alt="Фото 1">
        </div>

        <!-- Блок 2 - Музыкальный плеер -->
        <div class="block">
            <div class="player-container">
                <audio id="audio-track" src="music.mp3"></audio>
                
                <button id="play-pause-btn" class="play-btn">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <div class="player-info">
                    <div class="track-name">Ed Sheeran — Perfect</div>
                    <div class="progress-wrapper">
                        <input type="range" id="progress-bar" value="0" max="100">
                        <div class="time-display">
                            <span id="current-time">0:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- НОВЫЙ БЛОК - Фото we.png (добавлен после музыки) -->
        <div class="block image-block">
            <img src="we.jpg" alt="Мы">
        </div>

        <!-- Блок 3 - Фото 2 -->
        <div class="block image-block">
            <img src="photo2.png" alt="Фото 2">
        </div>

        <!-- Блок 4 - Фото 3 со ссылкой на карту -->
        <div class="block image-block">
            <a href="https://yandex.ru/maps/org/banketny_zal/16853403159/?ll=47.226258%2C56.133879&z=17" target="_blank" class="map-link">
                <img src="photo3.png" alt="Локация на карте">
            </a>
        </div>

        <!-- Блоки 5, 6, 7, 8 - Фотографии -->
        <div class="block image-block"><img src="photo4.png" alt="Фото 4"></div>
        <div class="block image-block"><img src="photo5.png" alt="Фото 5"></div>
        <div class="block image-block"><img src="photo6.png" alt="Фото 6"></div>
        <div class="block image-block"><img src="photo7.png" alt="Фото 7"></div>

        <!-- Блок 9 - Анкета -->
        <div class="block quiz-block">
            <form id="wedding-form">
                <div class="form-group">
                    <label for="guest-name" class="form-label">Ваше имя и фамилия</label>
                    <input type="text" id="guest-name" name="name" required class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Планируете ли Вы присутствовать на свадьбе?</label>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="yes" checked>
                        <span>Да, с удовольствием!</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="no">
                        <span>К сожалению, не смогу.</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </div>

        <!-- Блок (следующий) - Фото 8 -->
        <div class="block image-block"><img src="photo8.png" alt="Фото 8"></div>

        <!-- Блок 10 - Таймер обратного отсчета -->
        <div class="block">
            <div class="timer-wrapper">
                <div class="timer-container" id="dual-font-timer">
                    <div class="timer-item">
                        <div class="timer-value" id="d-val">00</div>
                        <div class="timer-label">дней</div>
                    </div>
                    <div class="timer-item">
                        <div class="timer-value" id="h-val">00</div>
                        <div class="timer-label">часов</div>
                    </div>
                    <div class="timer-item">
                        <div class="timer-value" id="m-val">00</div>
                        <div class="timer-label">минут</div>
                    </div>
                    <div class="timer-item">
                        <div class="timer-value" id="s-val">00</div>
                        <div class="timer-label">секунд</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Блок 11 - Фото 9 -->
        <div class="block image-block"><img src="photo9.jpg" alt="Фото 9"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
